# Uitspraaktrainer Zweeds — productieversie voor een lichte server thuis (zie app/README.md).
#
#   cp .env.voorbeeld .env              # adres, poort en gebruikers invullen
#   docker compose build
#   docker compose --profile bijwerken run --rm importeer      # teksten van de A- en B-site
#   docker compose --profile bijwerken run --rm woordenboek    # uitspraak van namen e.d. (MFA-G2P)
#   docker compose up -d                                       # trainer + voorbeeldstem op de achtergrond
#
# Alles wordt gebouwd vanuit deze map (app/). Alles draait als uid 1000; data/ moet
# voor die gebruiker schrijfbaar zijn. CPU- en geheugengrenzen houden de rest van de server (Home Assistant)
# bruikbaar: één analyse tegelijk, de drie modellen na elkaar, de voorbeeldstem op 1 kern met lage prioriteit.

x-altijd: &altijd
  restart: unless-stopped
  user: "1000:1000"

# De oefenteksten en de uitspraak van namen e.d. staan in git (app/teksten/); de import werkt ze bij.
x-teksten-env: &teksten-env
  TEKSTEN: /teksten/teksten.json
  WOORDENBOEK_EXTRA: /teksten/woordenboek_extra.dict

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    user: "1000:1000"
    ports: ["${HTTPS_POORT:-8443}:${HTTPS_POORT:-8443}"]
    environment:
      SITE_ADRESSEN: ${SITE_ADRESSEN:-https://localhost:8443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    mem_limit: 128m
    depends_on: [web]

  web:
    <<: *altijd
    build: { context: ., dockerfile: web/Dockerfile }
    image: uitspraak/web
    environment:
      <<: *teksten-env
      GEBRUIKERS: ${GEBRUIKERS:-Gebruiker 1,Gebruiker 2}
    ports: ["127.0.0.1:${WEB_POORT:-8090}:8080"]     # alleen op de server zelf (zonder microfoon: alleen kijken)
    volumes:
      - ./data:/data
      - ./teksten:/teksten:ro
      - ./data/caddy:/caddy:ro                       # rootcertificaat voor /certificaat
      # Bevroren ijking uit de proef (moedertaalsprekers = 100, Nederlands accent = 0); zie ONDERZOEK.md.
      - ./ijking:/ijking:ro
    cpus: 1
    mem_limit: 512m
    depends_on: [whisper-api, klanken-api, mfa-api]

  whisper-api:
    <<: *altijd
    build: { context: ., dockerfile: diensten/whisper/Dockerfile }
    image: uitspraak/whisper
    environment:
      <<: *teksten-env
      WHISPER_API_MODEL: small
      WHISPER_THREADS: ${ANALYSE_KERNEN:-3}
    volumes: [./data:/data, ./teksten:/teksten:ro]
    cpus: ${ANALYSE_KERNEN:-3}
    mem_limit: 1500m

  klanken-api:
    <<: *altijd
    build: { context: ., dockerfile: diensten/klanken/Dockerfile }
    image: uitspraak/klanken
    environment:
      <<: *teksten-env
      KLANKEN_THREADS: ${ANALYSE_KERNEN:-3}
      ONEDNN_PRIMITIVE_CACHE_CAPACITY: "8"   # elke opname heeft een andere lengte: kernelcache begrenzen
      LRU_CACHE_CAPACITY: "8"
    volumes: [./data:/data, ./teksten:/teksten:ro]
    cpus: ${ANALYSE_KERNEN:-3}
    mem_limit: 3g

  mfa-api:
    <<: *altijd
    build: { context: ., dockerfile: diensten/mfa/Dockerfile }
    image: uitspraak/mfa
    environment: *teksten-env
    shm_size: "1gb"
    volumes: [./data:/data, ./teksten:/teksten:ro]
    cpus: ${ANALYSE_KERNEN:-3}
    mem_limit: 2g

  voorbeeld:                        # voorbeeldstem (MMS) voor alle stukken, op de achtergrond
    <<: *altijd
    build: { context: ., dockerfile: diensten/klanken/Dockerfile }   # zelfde image als klanken-api
    image: uitspraak/klanken
    command: ["python", "maak.py"]
    environment:
      <<: *teksten-env
      # PyTorch bewaart per invoerlengte een gecompileerde kernel (oneDNN); elk stuk heeft een andere lengte, dus
      # zonder grens groeit het geheugen ±150 MB per stuk.
      ONEDNN_PRIMITIVE_CACHE_CAPACITY: "8"
      LRU_CACHE_CAPACITY: "8"
      MALLOC_ARENA_MAX: "2"
      OPNIEUW_NA: "100"              # na zoveel stukken herstart de taak zichzelf (geheugen vrij)
    volumes:
      - ./data:/data
      - ./teksten:/teksten:ro
    cpus: 1
    mem_limit: 1500m
    depends_on: [klanken-api, mfa-api, web]

  # ---------- bijwerken (alleen met 'docker compose --profile bijwerken run') ----------
  importeer:
    build: { context: ., dockerfile: importeer/Dockerfile }
    image: uitspraak/importeer
    user: "1000:1000"
    volumes:
      - ${BRON_A:-../../svenska_ovningar}:/bron/a:ro
      - ${BRON_B:-../../svenska_ovningar_b}:/bron/b:ro
      - ./teksten:/teksten
    profiles: [bijwerken]

  woordenboek:
    build: { context: ., dockerfile: diensten/mfa/Dockerfile }       # zelfde image als mfa-api
    image: uitspraak/mfa
    user: "1000:1000"
    command: ["python", "woordenboek.py"]
    environment: *teksten-env
    shm_size: "1gb"
    volumes:
      - ./teksten:/teksten
    profiles: [bijwerken]
